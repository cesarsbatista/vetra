<script>
(function(){
'use strict';
const KEY='vetra:v1',DEFAULT_CATS={
'Receitas':['Salário Ana Cristina - Unimed','Salário Ana Cristina - Unimed II','Salário César Augusto - SEE','Salário César Augusto - Mestrado','Benefícios','13º Salário','Férias','Outros'],
'Despesas fixas':['Financiamento Caixa','Condomínio','Seguro do Carro','IPTU','IPVA/Licenciamento','Empréstimo BB','Consignado BB I','Consignado BB II','Empréstimo Itaú','Conta Caixa'],
'Despesas variáveis':['Cemig','Origo','Nio 500MB','Claro Família','Apple One','Prime Video + Canais','HBO Max','Transporte Público','Transporte por App','Combustível','Estacionamento','Sem Parar','Supermercado','Feira','Açougue','Padaria','Lanchonetes','Medicamentos','Higiene Pessoal','Academia','Suplementos','Avaliação Física/Nutricional','Cabeleireiro','Manicure','Sobrancelha'],
'Despesas extras':['Médico','Dentista','Carro','Casa','Eletrodomésticos','Concursos','Materiais'],
'Despesas adicionais':['Presentes','Viagens/Passeios','Cinema/Teatro/Shows','Jogos/Esportes','Restaurantes/Bares','Roupas','Calçados','Acessórios','Enxoval','Decoração'],
'Investimentos':['Ações','Tesouro Direto','Renda Fixa','Previdência Privada','Bitcoin']};
const DEFAULT_CARDS=[{id:'bb',name:'Banco do Brasil · Smiles Platinum',closing:5,due:12},{id:'itau',name:'Itaú · Ana Cristina',closing:8,due:16},{id:'ria',name:'Riachuelo · César Augusto',closing:10,due:18}];
const current=new Date(); let month=new Date(current.getFullYear(),current.getMonth(),1),tab='inicio',kind='despesa',editId=null,filter='todos';
let db;
try{db=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){db=null}
if(!db||!Array.isArray(db.items))db={items:[],cards:DEFAULT_CARDS,budgets:{},settings:{name:'Família'}};
if(!db.cards)db.cards=DEFAULT_CARDS;if(!db.budgets)db.budgets={};
const el=document.getElementById('main'),q=(s)=>document.querySelector(s),money=(v)=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),mk=(d)=>d.slice(0,7),mkey=()=>month.getFullYear()+'-'+String(month.getMonth()+1).padStart(2,'0'),iso=(d)=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),today=()=>iso(new Date()),label=()=>month.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),persist=()=>{if(!window.VETRA_CLOUD?.house)localStorage.setItem(KEY,JSON.stringify(db));window.VETRA_CLOUD?.queueSave(db)};
const items=()=>db.items.filter(x=>mk(x.date)===mkey()),sum=(arr)=>arr.reduce((a,x)=>a+Number(x.amount||0),0),isSpent=(x)=>x.type==='despesa'||x.type==='cartao',totals=()=>{let its=items();return{income:sum(its.filter(x=>x.type==='receita'&&x.status==='realizado')),expenses:sum(its.filter(x=>isSpent(x)&&x.status==='realizado')),invested:sum(its.filter(x=>x.type==='investimento'&&x.status==='realizado')),expectedIncome:sum(its.filter(x=>x.type==='receita')),expectedExpenses:sum(its.filter(x=>isSpent(x))),expectedInvest:sum(its.filter(x=>x.type==='investimento'))}};
const icon=(x)=>x.type==='receita'?'↗':x.type==='investimento'?'◇':x.type==='cartao'?'▤':'↘';
function row(x,readonly=false){return '<div class="row"><div class="glyph">'+icon(x)+'</div><div class="rowtext"><strong>'+esc(x.description)+'</strong><small>'+esc(x.category)+' · '+x.date.split('-').reverse().join('/')+' · '+(x.status==='previsto'?'Previsto':'Realizado')+(x.by?' · '+esc(x.by):'')+'</small></div><span class="amount '+(x.type==='receita'?'positive':'negative')+'">'+(x.type==='receita'?'+':'−')+' '+money(x.amount)+'</span>'+(readonly?'':'<button class="iconbutton" data-edit="'+esc(x.id)+'" aria-label="Editar">✎</button>')+'</div>'}
function datePicker(){return '<div class="month"><button data-month="-1" aria-label="Mês anterior">‹</button><strong>'+label()+'</strong><button data-month="1" aria-label="Próximo mês">›</button></div>'}
function heading(a,b=''){return '<h1>'+a+'</h1><p class="subtitle">'+b+'</p>'}
function home(){let t=totals(),balance=t.income-t.expenses-t.invested,its=items().slice().sort((a,b)=>b.date.localeCompare(a.date));let groups={};its.filter(x=>isSpent(x)&&x.status==='realizado').forEach(x=>groups[x.category]=(groups[x.category]||0)+Number(x.amount));let parts=Object.entries(groups).sort((a,b)=>b[1]-a[1]).slice(0,4);let total=sum(its.filter(x=>isSpent(x)&&x.status==='realizado'));let pos=0;let colors=['#78998a','#a3b6aa','#c0ccc4','#e5eae6'];let segs=parts.map((v,i)=>{let start=pos;pos+=total?v[1]/total*100:0;return colors[i]+' '+start+'% '+pos+'%'});if(pos<100)segs.push('#e5eae6 '+pos+'% 100%');
return datePicker()+'<div class="card balance"><div class="eyebrow">Balanço realizado do mês</div><div class="money">'+money(balance)+'</div><span class="hint">Projeção: '+money(t.expectedIncome-t.expectedExpenses-t.expectedInvest)+'</span></div><div class="stats"><div class="card stat"><div class="dot">↗</div><span>Receitas</span><strong>'+money(t.income)+'</strong></div><div class="card stat"><div class="dot">↘</div><span>Despesas</span><strong>'+money(t.expenses)+'</strong></div><div class="card stat"><div class="dot">◇</div><span>Investimentos</span><strong>'+money(t.invested)+'</strong></div></div><div class="section"><h2>Despesas por categoria</h2><button class="link" data-tab="lancamentos">Ver detalhes ›</button></div><div class="card chart"><div class="donut" style="background:conic-gradient('+segs.join(',')+')"><span>'+money(total)+'</span></div><div class="legend">'+(parts.length?parts.map((p,i)=>'<div><b>●</b> '+esc(p[0])+': '+Math.round(p[1]/total*100)+'%</div>').join(''):'Sem despesas realizadas neste mês')+'</div></div><div class="section"><h2>Últimos lançamentos</h2><button class="link" data-tab="lancamentos">Ver todos ›</button></div><div class="card">'+(its.length?its.slice(0,5).map(x=>row(x,true)).join(''):'<div class="empty">Nenhum lançamento ainda.<br>Toque em + para registrar sua primeira movimentação.</div>')+'</div>'}
function list(){let its=items().filter(x=>filter==='todos'||(filter==='despesas'?isSpent(x):filter==='receitas'?x.type==='receita':x.status==='previsto')).sort((a,b)=>b.date.localeCompare(a.date));return heading('Lançamentos','Receitas, despesas e movimentações')+'<div class="seg">'+[['todos','Todos'],['receitas','Receitas'],['despesas','Despesas'],['previstos','Previstos']].map(z=>'<button data-filter="'+z[0]+'" class="'+(filter===z[0]?'selected':'')+'">'+z[1]+'</button>').join('')+'</div>'+datePicker()+'<div class="card">'+(its.length?its.map(x=>row(x)).join(''):'<div class="empty">Nenhum lançamento encontrado.</div>')+'</div>'}
function options(arr,chosen){return arr.map(x=>'<option value="'+esc(x)+'" '+(x===chosen?'selected':'')+'>'+esc(x)+'</option>').join('')}
function form(){let x=db.items.find(x=>x.id===editId)||{},types={despesa:'Despesa',receita:'Receita',cartao:'Cartão',investimento:'Investimento'};let selectedKind=x.type||kind,cat=selectedKind==='receita'?'Receitas':selectedKind==='investimento'?'Investimentos':selectedKind==='cartao'?'Despesas variáveis':'Despesas variáveis',categories=selectedKind==='receita'?['Receitas']:selectedKind==='investimento'?['Investimentos']:Object.keys(DEFAULT_CATS).filter(k=>k.startsWith('Despesas'));const chosen=x.category||cat;
return heading(editId?'Editar lançamento':'Novo lançamento','Registre uma movimentação financeira')+'<div class="seg">'+Object.entries(types).map(z=>'<button data-kind="'+z[0]+'" class="'+(selectedKind===z[0]?'selected':'')+'">'+z[1]+'</button>').join('')+'</div><form id="entry"><div class="card"><div class="field"><label for="amount">Valor (R$)</label><input id="amount" name="amount" type="number" min="0.01" step="0.01" inputmode="decimal" required value="'+esc(x.amount??'')+'" placeholder="0,00"></div><div class="field"><label for="description">Descrição</label><input id="description" name="description" required maxlength="90" value="'+esc(x.description||'')+'" placeholder="Ex.: Supermercado"></div><div class="field"><label for="category">Categoria</label><select id="category" name="category">'+options(categories,chosen)+'</select></div><div class="field"><label for="subcategory">Subcategoria</label><select id="subcategory" name="subcategory" data-chosen="'+esc(x.subcategory||'')+'"></select></div><div class="fieldgrid"><div class="field"><label for="date">Data</label><input id="date" name="date" type="date" required value="'+esc(x.date||today())+'"></div><div class="field"><label for="status">Situação</label><select id="status" name="status">'+options(['realizado','previsto'],x.status||'realizado')+'</select></div></div><div class="field '+(selectedKind==='cartao'?'':'hidden')+'" id="cardfield"><label for="card">Cartão</label><select id="card" name="card">'+db.cards.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===x.cardId?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select></div><div class="field"><label for="notes">Observações (opcional)</label><textarea id="notes" name="notes">'+esc(x.notes||'')+'</textarea></div><button class="primary" type="submit">'+(editId?'Salvar alterações':'Salvar lançamento')+'</button>'+(editId?'<button class="secondary danger" type="button" id="delete" style="width:100%">Excluir lançamento</button>':'')+'</div></form><div class="notice">Nesta V1, cartões são lançados individualmente. Parcelamentos automáticos e reconciliação de faturas serão acrescentados em uma próxima versão.</div>'}
function planning(){let t=totals(),projected=t.expectedIncome-t.expectedExpenses-t.expectedInvest;let spent=t.expenses;return heading('Planejamento','Previsto, realizado e projeções')+datePicker()+'<div class="card"><div class="eyebrow">Saldo projetado do mês</div><div class="money">'+money(projected)+'</div><span class="pill">Saldo realizado: '+money(t.income-t.expenses-t.invested)+'</span></div><div class="card"><h2>Previsto × realizado</h2>'+[['Receitas',t.expectedIncome,t.income],['Despesas',t.expectedExpenses,t.expenses],['Investimentos',t.expectedInvest,t.invested]].map(z=>'<div class="budget"><div class="flex"><strong class="small">'+z[0]+'</strong><span class="muted small">'+money(z[2])+' / '+money(z[1])+'</span></div><div class="progress"><div class="bar" style="width:'+Math.min(100,z[1]?z[2]/z[1]*100:0)+'%"></div></div></div>').join('')+'</div><div class="card"><h2>Orçamento mensal de despesas</h2><p class="subtitle">Defina uma meta para comparar com os gastos realizados.</p><form id="budget"><div class="field"><label for="budgetAmount">Limite de despesas (R$)</label><input id="budgetAmount" name="amount" type="number" min="0" step=".01" value="'+esc(db.budgets[mkey()]??'')+'" placeholder="Ex.: 8000"></div><button class="primary">Salvar orçamento</button></form>'+(db.budgets[mkey()]?'<div class="budget"><div class="flex"><span class="small">Utilizado</span><b class="small">'+Math.round(spent/db.budgets[mkey()]*100)+'%</b></div><div class="progress"><div class="bar" style="width:'+Math.min(100,spent/db.budgets[mkey()]*100)+'%"></div></div></div>':'')+'</div><p class="notice">Para compor a projeção, registre compromissos futuros com a situação “previsto”. Depois, edite-os para “realizado” quando ocorrerem.</p>'}
function cards(){let its=items().filter(x=>x.type==='cartao');return heading('Cartões','Compras registradas por cartão')+datePicker()+db.cards.map(c=>'<div class="card"><div class="flex"><h2>'+esc(c.name)+'</h2><span class="pill">'+money(sum(its.filter(x=>x.cardId===c.id)))+'</span></div><p class="subtitle">Fechamento dia '+c.closing+' · Vencimento dia '+c.due+'</p>'+(its.filter(x=>x.cardId===c.id).map(x=>row(x)).join('')||'<div class="empty">Sem compras registradas neste mês.</div>')+'</div>').join('')+'<p class="notice">Faturas, parcelamentos e lançamentos simplificados serão integrados ao controle híbrido em uma próxima versão.</p>'}
function investments(){let its=items().filter(x=>x.type==='investimento');return heading('Investimentos','Aportes e movimentações')+datePicker()+'<div class="card"><div class="eyebrow">Aportes realizados no mês</div><div class="money">'+money(sum(its.filter(x=>x.status==='realizado')))+'</div></div><div class="card">'+(its.length?its.map(x=>row(x)).join(''):'<div class="empty">Sem investimentos registrados.</div>')+'</div><button class="primary" data-kind="investimento">Adicionar aporte</button><p class="notice">Este módulo registra aportes; não calcula automaticamente valorização ou patrimônio de investimentos.</p>'}
function more(){return heading('Mais','Configurações e ferramentas')+'<div class="card">'+[['cards','▤','Cartões','Compras e lançamentos'],['investimentos','◇','Investimentos','Aportes registrados'],['export','⇩','Exportar CSV','Baixe seu histórico completo'],['backup','⇩','Backup JSON','Cópia para guardar seus dados'],['import','⇧','Restaurar backup','Importe uma cópia JSON']].map(x=>'<div class="row" data-action="'+x[0]+'" role="button" tabindex="0"><div class="glyph">'+x[1]+'</div><div class="rowtext"><strong>'+x[2]+'</strong><small>'+x[3]+'</small></div><span>›</span></div>').join('')+'</div><div class="card"><h2>Armazenamento</h2><p class="subtitle">'+(window.VETRA_CLOUD?.house?'Conta conectada · Orçamento compartilhado na nuvem':'Modo local · Dados salvos somente neste navegador')+'</p>'+(window.VETRA_CLOUD?.house?'':'<button class="secondary danger" id="reset">Apagar todos os dados locais</button>')+'</div><input id="importFile" type="file" accept="application/json,.json" hidden>'}
function render(){q('.tabs').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));el.innerHTML=({inicio:home,lancamentos:list,novo:form,planejamento:planning,mais:more,cards,investimentos:investments}[tab]||home)();if(tab==='novo')subcats()}
function subcats(){let cat=q('#category'),sub=q('#subcategory');if(!cat||!sub)return;let val=sub.dataset.chosen||sub.value;sub.innerHTML=options(DEFAULT_CATS[cat.value]||['Outros'],val);sub.dataset.chosen=''}
function go(t){tab=t;render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab]');if(t){editId=null;go(t.dataset.tab);return}let m=e.target.closest('[data-month]');if(m){month.setMonth(month.getMonth()+Number(m.dataset.month));render();return}let k=e.target.closest('[data-kind]');if(k){kind=k.dataset.kind;editId=null;go('novo');return}let f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}let ed=e.target.closest('[data-edit]');if(ed){editId=ed.dataset.edit;go('novo');return}let a=e.target.closest('[data-action]');if(a){const action=a.dataset.action;if(['cards','investimentos'].includes(action))go(action);else if(action==='export')exportCSV();else if(action==='backup')backup();else if(action==='import')q('#importFile').click();return}if(e.target.id==='delete'){if(confirm('Excluir este lançamento?')){db.items=db.items.filter(x=>x.id!==editId);persist();editId=null;go('lancamentos')}}if(e.target.id==='reset'){if(window.VETRA_CLOUD?.house){alert('Para evitar exclusões acidentais, não é possível zerar todo o orçamento compartilhado por aqui.');return}if(confirm('Apagar todos os lançamentos, cartões e orçamentos deste navegador? Esta ação não pode ser desfeita.')){db={items:[],cards:DEFAULT_CARDS,budgets:{},settings:{name:'Família'}};persist();go('inicio')}}if(e.target.id==='profile'&&!window.VETRA_CURRENT_SESSION)alert('VETRA · modo local. Seus dados estão armazenados neste navegador.')});
document.addEventListener('change',e=>{if(e.target.id==='category')subcats();if(e.target.id==='importFile'&&e.target.files[0]){let reader=new FileReader();reader.onload=()=>{try{let data=JSON.parse(reader.result);if(!Array.isArray(data.items)||!Array.isArray(data.cards))throw Error('Formato inválido');if(confirm(window.VETRA_CLOUD?.house?'ATENÇÃO: restaurar este arquivo substituirá os lançamentos de toda a família na nuvem. Deseja continuar?':'Substituir todos os dados locais pelo backup selecionado?')){db={items:data.items,cards:data.cards,budgets:data.budgets||{},settings:data.settings||{}};persist();go('inicio')}}catch(err){alert('Não foi possível importar: '+err.message)}};reader.readAsText(e.target.files[0])}});
document.addEventListener('submit',e=>{if(e.target.id==='entry'){e.preventDefault();let f=new FormData(e.target),amount=Number(f.get('amount')),type=editId?(db.items.find(x=>x.id===editId)||{}).type:kind;if(!amount||amount<=0)return alert('Informe um valor maior que zero.');let x={id:editId||((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())),type,amount,date:String(f.get('date')),description:String(f.get('description')).trim(),category:String(f.get('category')),subcategory:String(f.get('subcategory')),status:String(f.get('status')),notes:String(f.get('notes')||''),by:editId?(db.items.find(y=>y.id===editId)?.by||''):(window.VETRA_CURRENT_SESSION?.user?.email||'Local'),cardId:type==='cartao'?String(f.get('card')):null};if(!x.description)return alert('Informe uma descrição.');db.items=editId?db.items.map(y=>y.id===editId?x:y):[...db.items,x];persist();month=new Date(Number(x.date.slice(0,4)),Number(x.date.slice(5,7))-1,1);editId=null;go('lancamentos')}if(e.target.id==='budget'){e.preventDefault();let value=Number(new FormData(e.target).get('amount'));if(value<0||!Number.isFinite(value))return;db.budgets[mkey()]=value;persist();render()}});
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function exportCSV(){let headers=['Data','Tipo','Descrição','Categoria','Subcategoria','Valor','Situação','Cartão','Observações'];let lines=db.items.map(x=>[x.date,x.type,x.description,x.category,x.subcategory,x.amount,x.status,db.cards.find(c=>c.id===x.cardId)?.name||'',x.notes||'']);let csv=[headers,...lines].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');download('vetra-lancamentos.csv','\ufeff'+csv,'text/csv;charset=utf-8')}
function backup(){download('vetra-backup.json',JSON.stringify(db,null,2),'application/json')}
window.VETRA_APP={get:()=>structuredClone(db),replace:(next,store=true)=>{db=next;if(store)localStorage.setItem(KEY,JSON.stringify(db));render()},render};
render();
})();
</script><script type="module" id="vetra-gate-script">
const gate=document.getElementById('vetraGate'),target=document.getElementById('vetraGateContent');
const cfg=window.VETRA_SUPABASE||{},ready=!!(cfg.url&&cfg.publishableKey);
let client=null,email='',step='welcome',busy=false,session=null,cooldown=0;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function init(){
 if(ready){try{
  const lib=await import('https://esm.sh/@supabase/supabase-js@2.57.0');
  client=lib.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const s=await client.auth.getSession();
  session=s.data.session;
  window.VETRA_CLIENT=client;window.VETRA_CURRENT_SESSION=session;
  client.auth.onAuthStateChange((_event,next)=>{session=next;window.VETRA_CURRENT_SESSION=next;if(next)gate.hidden=true;window.dispatchEvent(new CustomEvent('vetra:auth',{detail:{client,session:next}}));});
  if(session){gate.hidden=true;window.dispatchEvent(new CustomEvent('vetra:auth',{detail:{client,session}}));return}
 }catch(err){console.error('Falha ao inicializar autenticação',err)}}
 show();
}
function error(message){const field=target.querySelector('#vetraCodeMessage')||target.querySelector('#vetraAuthError');if(field)field.textContent=message}
function show(){
 if(step==='welcome'){target.innerHTML='<p class="vetra-gate-kicker">Seu dinheiro, com clareza.</p><h1 class="vetra-gate-title">Organize hoje.<br><em>Planeje melhor<br>o amanhã.</em></h1><p class="vetra-gate-desc">Receitas, despesas e objetivos compartilhados em um único lugar, com a simplicidade que você precisa.</p><button class="vetra-gate-button" id="vetraStart">Começar →</button><button class="vetra-gate-ghost" id="vetraLocal">Continuar no modo local</button>'}
 else if(step==='email'){target.innerHTML='<p class="vetra-gate-kicker">Acesso seguro</p><h1 class="vetra-gate-title">Bem-vindo<br><em>ao VETRA.</em></h1><p class="vetra-gate-desc">Informe seu e-mail para receber um código de acesso de 6 dígitos.</p><form id="vetraEmailForm"><label for="vetraEmail" style="font-size:12px;color:#65756a">E-mail</label><input class="vetra-gate-input" type="email" id="vetraEmail" autocomplete="email" required placeholder="seu@email.com" value="'+escapeHtml(email)+'"><button class="vetra-gate-button" id="vetraSend">'+(busy?'Enviando…':'Receber código →')+'</button></form><p class="vetra-gate-error" id="vetraAuthError" role="alert"></p><button class="vetra-gate-ghost" id="vetraBack">← Voltar</button>'+(!client?'<div class="vetra-gate-alert">Autenticação ainda não conectada: é necessário configurar o projeto Supabase do VETRA. Continue no modo local enquanto isso.</div>':'')}
 else{target.innerHTML='<p class="vetra-gate-kicker">Verificação por e-mail</p><h1 class="vetra-gate-title">Seu código<br><em>de acesso.</em></h1><p class="vetra-gate-desc">Digite os seis números enviados para <strong>'+escapeHtml(email)+'</strong>.</p><div class="vetra-code" role="group" aria-label="Código de seis dígitos">'+[0,1,2,3,4,5].map(i=>'<input class="vetra-digit" aria-label="Dígito '+(i+1)+'" inputmode="numeric" autocomplete="'+(i===0?'one-time-code':'off')+'" maxlength="1" pattern="[0-9]" data-index="'+i+'">').join('')+'</div><p class="vetra-gate-error" id="vetraCodeMessage" role="alert"></p><button class="vetra-gate-button" id="vetraVerify">'+(busy?'Verificando…':'Entrar')+'</button><button class="vetra-gate-ghost" id="vetraResend">Reenviar código</button><button class="vetra-gate-ghost" id="vetraChange">Alterar e-mail</button>';setTimeout(()=>target.querySelector('.vetra-digit')?.focus(),40)}
}
async function sendCode(){if(!client){error('O Supabase do VETRA ainda precisa ser configurado.');return}if(busy)return;if(Date.now()<cooldown){error('Espere um minuto antes de reenviar o código.');return}busy=true;const button=target.querySelector('#vetraSend');if(button)button.disabled=true;try{const {error:err}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(err)throw err;cooldown=Date.now()+60000;step='code';show()}catch(e){error(e.message||'Falha no envio do código.');if(button)button.disabled=false}finally{busy=false}}
async function verifyCode(){if(!client){error('Configure o Supabase antes de entrar.');return}const token=[...target.querySelectorAll('.vetra-digit')].map(x=>x.value).join('');if(!/^\d{6}$/.test(token)){error('Digite os seis números do e-mail.');return}if(busy)return;busy=true;try{const {data,error:err}=await client.auth.verifyOtp({email,token,type:'email'});if(err)throw err;session=data.session;window.VETRA_CURRENT_SESSION=session;gate.hidden=true;window.dispatchEvent(new CustomEvent('vetra:auth',{detail:{client,session}}));}catch(e){error(e.message||'Código inválido ou expirado.')}finally{busy=false}}

target.addEventListener('submit',async e=>{if(e.target.id==='vetraEmailForm'){e.preventDefault();email=target.querySelector('#vetraEmail').value.trim().toLowerCase();await sendCode()}});
target.addEventListener('click',async e=>{
if(e.target.id==='vetraStart'){step='email';show()}
else if(e.target.id==='vetraLocal'){gate.hidden=true}
else if(e.target.id==='vetraBack'){step='welcome';show()}
else if(e.target.id==='vetraChange'){step='email';show()}
else if(e.target.id==='vetraVerify'){await verifyCode()}
else if(e.target.id==='vetraResend'){if(Date.now()<cooldown){error('Aguarde um minuto antes de solicitar novo código.');return}await sendCode()}
});
target.addEventListener('input',e=>{if(!e.target.classList.contains('vetra-digit'))return;const fields=[...target.querySelectorAll('.vetra-digit')];const field=e.target;field.value=field.value.replace(/\D/g,'').slice(-1);if(field.value)fields[Number(field.dataset.index)+1]?.focus()});
target.addEventListener('keydown',e=>{if(!e.target.classList.contains('vetra-digit'))return;const fields=[...target.querySelectorAll('.vetra-digit')];if(e.key==='Backspace'&&!e.target.value)fields[Number(e.target.dataset.index)-1]?.focus()});
target.addEventListener('paste',e=>{if(!e.target.classList.contains('vetra-digit'))return;const token=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);if(token){e.preventDefault();const fields=[...target.querySelectorAll('.vetra-digit')];fields.forEach((field,i)=>field.value=token[i]||'');fields[Math.min(token.length,5)]?.focus()}});
document.getElementById('profile')?.addEventListener('click',async e=>{
 e.stopImmediatePropagation();
 if(session){if(window.VETRA_CLOUD&&!window.VETRA_CLOUD.canLogout()){alert('Existem alterações pendentes ou não sincronizadas. Faça backup JSON e conclua a sincronização antes de sair.');return}if(confirm('Sair da conta VETRA?')){await client.auth.signOut();session=null;window.VETRA_CURRENT_SESSION=null;window.dispatchEvent(new CustomEvent('vetra:auth',{detail:{client,session:null}}));step='welcome';gate.hidden=false;show()}}
 else{step='welcome';gate.hidden=false;show()}
},true);
init();
</script><script type="module" src="cloud.js"></script></body></html>
