<style>

17px 0 10px}.extra-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.extra-actions button{flex:1}.hidden{display:none!important}@media(min-width:660px){body{background:linear-gradient(125deg,#ebf0ed,#f8f9f8)}.app{border-left:1px solid #e4eae5;border-right:1px solid #e4eae5;background:#f7f8f6;min-height:100vh}.tabs{border-radius:22px 22px 0 0}}@media(max-width:360px){.stat strong{font-size:12px}.money{font-size:30px}.chart{gap:10px}}

<script src="v2.js?v=2.3.3"></script><script type="module" id="vetra-gate-script">
const gate=document.getElementById('vetraGate'),target=document.getElementById('vetraGateContent');
const cfg=window.VETRA_SUPABASE||{},ready=!!(cfg.url&&cfg.publishableKey);
let client=null,email='',step='welcome',busy=false,session=null,cooldown=0;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
async function init(){
 if(ready){try{
  const lib=await import('https://esm.sh/@supabase/supabase-js@2.57.0');
  client=lib.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  const s=await client.auth.getSession();
  session=s.data.session;
  window.VETRA_CLIENT=client;window.VETRA_CURRENT_SESSION=session;
  client.auth.onAuthStateChange((_event,next)=>{session=next;window.VETRA_CURRENT_SESSION=next;if(next)gate.hidden=true;window.dispatchEvent(new CustomEvent('vetra:auth',{detail:{client,session:next}}));});
  if(session){gate.hidden=true;window.dispatchEvent(new CustomEvent('vetra:auth',{detail:{client,session}}));return}
 }catch(err){console.error('Falha ao inicializar autenticação',err)}}
 show();
}
function error(message){const field=target.querySelector('#vetraCodeMessage')||target.querySelector('#vetraAuthError');if(field)field.textContent=message}
function show(){
 if(step==='welcome'){target.innerHTML='<p class="vetra-gate-kicker">Seu dinheiro, com clareza.</p><h1 class="vetra-gate-title">Organize hoje.<br><em>Planeje melhor<br>o amanhã.</em></h1><p class="vetra-gate-desc">Receitas, despesas e objetivos compartilhados em um único lugar, com a simplicidade que você precisa.</p><button class="vetra-gate-button" id="vetraStart">Começar →</button><button class="vetra-gate-ghost" id="vetraLocal">Continuar no modo local</button>'}
 else if(step==='email'){target.innerHTML='<p class="vetra-gate-kicker">Acesso seguro</p><h1 class="vetra-gate-title">Bem-vindo<br><em>ao VETRA.</em></h1><p class="vetra-gate-desc">Informe seu e-mail para receber um código de acesso de 6 dígitos.</p><form id="vetraEmailForm"><label for="vetraEmail" style="font-size:12px;color:#65756a">E-mail</label><input class="vetra-gate-input" type="email" id="vetraEmail" autocomplete="email" required placeholder="seu@email.com" value="'+escapeHtml(email)+'"><button class="vetra-gate-button" id="vetraSend">'+(busy?'Enviando…':'Receber código →')+'</button></form><p class="vetra-gate-error" id="vetraAuthError" role="alert"></p><button class="vetra-gate-ghost" id="vetraBack">← Voltar</button>'+(!client?'<div class="vetra-gate-alert">Autenticação ainda não conectada: é necessário configurar o projeto Supabase do VETRA. Continue no modo local enquanto isso.</div>':'')}
 else{target.innerHTML='<p class="vetra-gate-kicker">Verificação por e-mail</p><h1 class="vetra-gate-title">Seu código<br><em>de acesso.</em></h1><p class="vetra-gate-desc">Digite os seis números enviados para <strong>'+escapeHtml(email)+'</strong>.</p><div class="vetra-code" role="group" aria-label="Código de seis dígitos">'+[0,1,2,3,4,5].map(i=>'<input class="vetra-digit" aria-label="Dígito '+(i+1)+'" inputmode="numeric" autocomplete="'+(i===0?'one-time-code':'off')+'" maxlength="1" pattern="[0-9]" data-index="'+i+'">').join('')+'</div><p class="vetra-gate-error" id="vetraCodeMessage" role="alert"></p><button class="vetra-gate-button" id="vetraVerify">'+(busy?'Verificando…':'Entrar')+'</button><button class="vetra-gate-ghost" id="vetraResend">Reenviar código</button><button class="vetra-gate-ghost" id="vetraChange">Alterar e-mail</button>';setTimeout(()=>target.querySelector('.vetra-digit')?.focus(),40)}
}
async function sendCode(){if(!client){error('O Supabase do VETRA ainda precisa ser configurado.');return}if(busy)return;if(Date.now()<cooldown){error('Espere um minuto antes de reenviar o código.');return}busy=true;const button=target.querySelector('#vetraSend');if(button)button.disabled=true;try{const {error:err}=await client.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(err)throw err;cooldown=Date.now()+60000;step='code';show()}catch(e){error(e.message||'Falha no envio do código.');if(button)button.disabled=false}finally{busy=false}}
async function verifyCode(){if(!client){error('Configure o Supabase antes de entrar.');return}const token=[...target.querySelectorAll('.vetra-digit')].map(x=>x.value).join('');if(!/^\d{6}$/.test(token)){error('Digite os seis números do e-mail.');return}if(busy)return;busy=true;try{const {data,error:err}=await client.auth.verifyOtp({email,token,type:'email'});if(err)throw err;session=data.session;window.VETRA_CURRENT_SESSION=session;gate.hidden=true;window.dispatchEvent(new CustomEvent('vetra:auth',{detail:{client,session}}));}catch(e){error(e.message||'Código inválido ou expirado.')}finally{busy=false}}

target.addEventListener('submit',async e=>{if(e.target.id==='vetraEmailForm'){e.preventDefault();email=target.querySelector('#vetraEmail').value.trim().toLowerCase();await sendCode()}});
target.addEventListener('click',async e=>{
if(e.target.id==='vetraStart'){step='email';show()}
else if(e.target.id==='vetraLocal'){gate.hidden=true}
else if(e.target.id==='vetraBack'){step='welcome';show()}
else if(e.target.id==='vetraChange'){step='email';show()}
else if(e.target.id==='vetraVerify'){await verifyCode()}
else if(e.target.id==='vetraResend'){if(Date.now()<cooldown){error('Aguarde um minuto antes de solicitar novo código.');return}await sendCode()}
});
target.addEventListener('input',e=>{if(!e.target.classList.contains('vetra-digit'))return;const fields=[...target.querySelectorAll('.vetra-digit')];const field=e.target;field.value=field.value.replace(/\D/g,'').slice(-1);if(field.value)fields[Number(field.dataset.index)+1]?.focus()});
target.addEventListener('keydown',e=>{if(!e.target.classList.contains('vetra-digit'))return;const fields=[...target.querySelectorAll('.vetra-digit')];if(e.key==='Backspace'&&!e.target.value)fields[Number(e.target.dataset.index)-1]?.focus()});
target.addEventListener('paste',e=>{if(!e.target.classList.contains('vetra-digit'))return;const token=e.clipboardData.getData('text').replace(/\D/g,'').slice(0,6);if(token){e.preventDefault();const fields=[...target.querySelectorAll('.vetra-digit')];fields.forEach((field,i)=>field.value=token[i]||'');fields[Math.min(token.length,5)]?.focus()}});
document.getElementById('profile')?.addEventListener('click',async e=>{
 e.stopImmediatePropagation();
 if(session){if(window.VETRA_CLOUD&&!window.VETRA_CLOUD.canLogout()){alert('Existem alterações pendentes ou não sincronizadas. Faça backup JSON e conclua a sincronização antes de sair.');return}if(confirm('Sair da conta VETRA?')){await client.auth.signOut();session=null;window.VETRA_CURRENT_SESSION=null;window.dispatchEvent(new CustomEvent('vetra:auth',{detail:{client,session:null}}));step='welcome';gate.hidden=false;show()}}
 else{step='welcome';gate.hidden=false;show()}
},true);
init();
</script><script type="module" src="cloud.js?v=2.2.7"></script></body></html>
