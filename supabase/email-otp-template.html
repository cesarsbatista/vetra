<!doctype html>
<html lang="pt-BR">
<body style="background:#f6f7f5;color:#242a28;font-family:Arial,Helvetica,sans-serif;padding:24px">
  <main style="max-width:440px;margin:auto;background:#fff;border:1px solid #e1e6e1;border-radius:16px;padding:28px">
    <div style="font-size:12px;letter-spacing:3px;font-weight:bold;color:#587565">VETRA</div>
    <h1 style="font-size:24px;margin:22px 0 10px">Seu código de acesso</h1>
    <p style="font-size:14px;line-height:1.6;color:#59655d">Digite este código no VETRA para entrar na sua conta.</p>
    <p style="font-size:32px;letter-spacing:7px;font-weight:bold;text-align:center;margin:28px 0;color:#40594f">{{ .Token }}</p>
    <p style="font-size:12px;color:#858c85">Se você não solicitou este acesso, ignore a mensagem. Não compartilhe o código.</p>
  </main>
</body>
</html>
